<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <!-- 보노보노 (Bonobono with Pink Shell) -->
  <defs>
    <!-- 부드러운 하이라이트 -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 꼬리 -->
    <path d="M 52 195 C 20 200, 18 180, 48 175" fill="#64B5F6" />

    <!-- 다리 및 발 -->
    <!-- 왼발 -->
    <path d="M 68 238 C 65 248, 50 252, 38 252 C 32 252, 28 250, 32 245 C 36 240, 50 238, 58 235 Z" fill="#64B5F6" />
    <path d="M 40 248 C 45 244, 48 240, 48 240" fill="none" stroke-width="3" />
    <path d="M 48 250 C 52 245, 54 240, 54 240" fill="none" stroke-width="3" />

    <!-- 오른발 -->
    <path d="M 172 238 C 175 248, 190 252, 202 252 C 208 252, 212 250, 208 245 C 204 240, 190 238, 182 235 Z" fill="#64B5F6" />
    <path d="M 200 248 C 195 244, 192 240, 192 240" fill="none" stroke-width="3" />
    <path d="M 192 250 C 188 245, 186 240, 186 240" fill="none" stroke-width="3" />

    <!-- 몸통 -->
    <path d="M 72 135 C 55 170, 50 215, 68 238 C 90 244, 150 244, 172 238 C 190 215, 185 170, 168 135 Z" fill="#64B5F6" />

    <!-- 왼팔 (인사하는 팔) -->
    <path d="M 166 142 C 182 130, 202 110, 205 88 C 200 85, 194 92, 190 90 C 188 88, 186 94, 182 92 C 180 105, 168 130, 150 148" fill="#64B5F6" />

    <!-- 머리 -->
    <ellipse cx="120" cy="85" rx="72" ry="76" fill="#64B5F6" />

    <!-- 오른팔 (조개 든 팔) -->
    <path d="M 74 142 C 58 130, 38 110, 35 88 C 40 85, 46 92, 50 90 C 52 88, 54 94, 58 92 C 60 105, 72 130, 90 148" fill="#64B5F6" />

    <!-- 분홍 조개 (오른손에 쥔 조개) -->
    <g transform="translate(5, 5)">
      <!-- 조개 본체 -->
      <path d="M 28 88 C 12 76, 15 58, 30 54 C 45 50, 52 64, 46 80 Z" fill="#F48FB1" stroke="#1A1A1A" stroke-width="4" />
      <!-- 조개 골/주름선 -->
      <path d="M 38 78 L 22 62" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
      <path d="M 40 76 L 30 56" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
      <path d="M 42 75 L 40 56" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
    </g>

    <!-- 눈 (양 옆으로 멀리 떨어진 콩알눈) -->
    <ellipse cx="64" cy="62" rx="4.5" ry="5.5" fill="#1A1A1A" stroke="none" />
    <ellipse cx="176" cy="62" rx="4.5" ry="5.5" fill="#1A1A1A" stroke="none" />

    <!-- 주둥이 (수염 주머니 볼록한 두 개의 흰색 원) -->
    <ellipse cx="106" cy="98" rx="17" ry="16" fill="#FFFFFF" />
    <ellipse cx="134" cy="98" rx="17" ry="16" fill="#FFFFFF" />

    <!-- 코 (중앙의 둥근 검은 코) -->
    <ellipse cx="120" cy="82" rx="11" ry="10" fill="#1A1A1A" stroke="none" />
    <!-- 코 하이라이트 -->
    <ellipse cx="117" cy="79" rx="3.5" ry="2.5" fill="#FFFFFF" stroke="none" opacity="0.6" />

    <!-- 수염 (양쪽 3가닥씩 총 6가닥) -->
    <!-- 왼쪽 수염 -->
    <path d="M 94 88 L 70 86" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
    <path d="M 92 98 L 68 100" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
    <path d="M 94 108 L 72 114" stroke="#1A1A1A" stroke-width="3.5" fill="none" />

    <!-- 오른쪽 수염 -->
    <path d="M 146 88 L 170 86" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
    <path d="M 148 98 L 172 100" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
    <path d="M 146 108 L 168 114" stroke="#1A1A1A" stroke-width="3.5" fill="none" />
  </g>
</svg>
